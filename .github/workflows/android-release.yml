name: Android build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mediaforge_url:
        description: "URL de l’instance MediaForge embarquée dans l’APK"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK and create release
    runs-on: ubuntu-latest

    env:
      MEDIAFORGE_URL: ${{ inputs.mediaforge_url || vars.MEDIAFORGE_URL || 'http://10.0.2.2:8080/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Determine next release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            base_version="$(sed -n 's/.*versionName = "\([0-9.]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
            tag_name="v${base_version:-0.1.0}"
          elif [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            next_patch=$((BASH_REMATCH[3] + 1))
            tag_name="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$next_patch"
          else
            echo "Tag existant non conforme : $latest_tag" >&2
            exit 1
          fi

          if git show-ref --tags --verify --quiet "refs/tags/$tag_name"; then
            echo "Le tag $tag_name existe déjà." >&2
            exit 1
          fi

          if [[ "$tag_name" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version_code=$((BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3]))
          else
            echo "Version générée non conforme : $tag_name" >&2
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "version_name=${tag_name#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Création de la release $tag_name"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Le secret ANDROID_KEYSTORE_BASE64 est absent." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mediaforge-release.keystore"

      - name: Configure Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "$FIREBASE_CONFIG" ]]; then
            printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
          elif [[ -f app/google-services.json ]]; then
            echo "Fichier Firebase présent dans le dépôt."
          else
            echo "Secret FIREBASE_GOOGLE_SERVICES_JSON absent : les notifications push seront désactivées dans cet APK."
          fi

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/mediaforge-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PMEDIAFORGE_URL="$MEDIAFORGE_URL" \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PANDROID_KEYSTORE_FILE="$ANDROID_KEYSTORE_FILE" \
            -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"

      - name: Prepare APK
        shell: bash
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "mediaforge-${TAG_NAME}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: mediaforge-${{ steps.release.outputs.tag_name }}
          path: mediaforge-${{ steps.release.outputs.tag_name }}.apk
          if-no-files-found: error

      - name: Create and push release tag
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "MediaForge Android $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release create "$TAG_NAME" \
            "mediaforge-${TAG_NAME}.apk" \
            --title "MediaForge Android ${TAG_NAME}" \
            --generate-notes \
            --target "$GITHUB_SHA"
