name: Android build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mediaforge_url:
        description: "URL de l’instance MediaForge embarquée dans l’APK"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      MEDIAFORGE_URL: ${{ inputs.mediaforge_url || vars.MEDIAFORGE_URL || 'http://10.0.2.2:8080/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -PMEDIAFORGE_URL="$MEDIAFORGE_URL"

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          release_name="${GITHUB_REF_NAME:-manual}"
          cp app/build/outputs/apk/debug/app-debug.apk "mediaforge-${release_name}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: mediaforge-${{ github.ref_name }}
          path: mediaforge-*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "mediaforge-${GITHUB_REF_NAME}.apk" \
            --title "MediaForge Android ${GITHUB_REF_NAME}" \
            --generate-notes
